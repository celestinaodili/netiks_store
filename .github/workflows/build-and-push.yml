name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to deploy, e.g. v1.0.0"
        required: true
        type: string

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint dependencies
        run: pip install ruff

      - name: Lint Python services
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install web app dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint:web

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          docker compose -f docker-compose.yml config --quiet

  build-and-push:
    name: Build and Push (${{ matrix.service }})
    needs: validate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        include:
          - service: web
            path: infra/docker/web.Dockerfile
            context: .

          - service: gateway
            path: apps/gateway/Dockerfile
            context: .

          - service: identity-service
            path: services/identity-service/Dockerfile
            context: .

          - service: vendor-service
            path: services/vendor-service/Dockerfile
            context: .

          - service: catalog-service
            path: services/catalog-service/Dockerfile
            context: .

          - service: media-service
            path: services/media-service/Dockerfile
            context: .

          - service: admin-service
            path: services/admin-service/Dockerfile
            context: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/netiks-store/${{ matrix.service }}:${{ github.sha }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS}
          ${{ env.REGISTRY }}/netiks-store/${{ matrix.service }}:${{ github.ref_name }}
          ${{ env.REGISTRY }}/netiks-store/${{ matrix.service }}:latest"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            az login --identity --output none

            az acr login --name "${{ vars.ACR_LOGIN_SERVER }}" 2>/dev/null \
              || az acr login --name "$(echo ${{ vars.ACR_LOGIN_SERVER }} | cut -d. -f1)"

            cd /home/deploy/netiks_store-staging

            git fetch origin main
            git checkout --force main
            git reset --hard origin/main

            export IMAGE_TAG="${{ github.sha }}"
            export REGISTRY="${{ vars.ACR_LOGIN_SERVER }}/netiks-store"

            docker compose \
              -p netiks_staging \
              --env-file .env \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              pull

            docker compose \
              -p netiks_staging \
              --env-file .env \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d

            docker compose \
              -p netiks_staging \
              --env-file .env \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              ps

  deploy:
    name: Deploy to Production
    needs: [build-and-push]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            az login --identity --output none

            az acr login --name "${{ vars.ACR_LOGIN_SERVER }}" 2>/dev/null \
              || az acr login --name "$(echo ${{ vars.ACR_LOGIN_SERVER }} | cut -d. -f1)"

            cd ~/netiks_store

            VERSION="${{ inputs.version || github.ref_name }}"

            git fetch --tags origin
            git checkout --force "$VERSION"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps