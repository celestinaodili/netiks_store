name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint dependencies
        run: pip install ruff

      - name: Lint Python services
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install web app dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint:web

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          docker compose -f docker-compose.yml config --quiet

  build-and-push:
    name: Build and Push (${{ matrix.service }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC federation to Azure

    strategy:
      matrix:
        include:
          - service: web
            path: infra/docker/web.Dockerfile
            context: .
          - service: gateway
            path: apps/gateway/Dockerfile
            context: .
          - service: identity-service
            path: services/identity-service/Dockerfile
            context: .
          - service: vendor-service
            path: services/vendor-service/Dockerfile
            context: .
          - service: catalog-service
            path: services/catalog-service/Dockerfile
            context: .
          - service: media-service
            path: services/media-service/Dockerfile
            context: .
          - service: admin-service
            path: services/admin-service/Dockerfile
            context: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure #(OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS}
          ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.ref_name }}
          ${{ env.REGISTRY }}/${{ matrix.service }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd ~/netiks_store

            VERSION="${{ github.ref_name }}"

            git fetch --tags origin
            git checkout --force "$VERSION"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps